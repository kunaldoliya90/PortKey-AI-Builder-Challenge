name: Deploy to EC2

on:
  push:
    branches:
      - main  # Set this to your default branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-prompt-parser:latest

      # 4. SSH into EC2 and Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop the old container if it exists
            docker stop smart-prompt-parser || true
            docker rm smart-prompt-parser || true

            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/smart-prompt-parser:latest

            # Run the new container with environment variables
            docker run -d \
              --name smart-prompt-parser \
              -p 8000:8000 \
              -e PORTKEY__API_KEY=${{ secrets.PORTKEY_API_KEY }} \
              -e DATABASE__POSTGRESQL__HOST=${{ secrets.DB_HOST }} \
              -e DATABASE__POSTGRESQL__PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DATABASE__POSTGRESQL__USERNAME=${{ secrets.DB_USER }} \
              -e DATABASE__POSTGRESQL__DATABASE=${{ secrets.DB_NAME }} \
              -e DATABASE__REDIS__HOST=${{ secrets.REDIS_HOST }} \
              -e DATABASE__REDIS__PASSWORD=${{ secrets.REDIS_PASSWORD }} \
              -e DATABASE__VECTOR_DB__QDRANT__HOST=${{ secrets.QDRANT_HOST }} \
              -e DATABASE__VECTOR_DB__QDRANT__API_KEY=${{ secrets.QDRANT_API_KEY }} \
              ${{ secrets.DOCKER_USERNAME }}/smart-prompt-parser:latest
